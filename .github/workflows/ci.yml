---
# Tier-0 (repository validation) + the device-free crypto scenario.
#
# These jobs are cheap and need no VMs, so they run on every push and PR:
#   - validate         : YAML lint + ansible-lint (production profile)
#   - ansible-versions : syntax-check the role across supported ansible-core
#   - network          : Tier-0 crypto/network Molecule scenario (Docker driver)
#   - device-free-tests: device-free regression tests — the crypttab UUID-
#                        collision guard (audit + pre-flight assertions) and the
#                        disk-discovery selection logic
#
# The heavier libvirt/KVM VM tiers (Tier-1 keyslot, Tier-2 boot ordering) live in
# vm-tests.yml, which needs a KVM-capable runner.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # ansible-compat/molecule git-init a temp dir during prerun; give git a default
  # branch so it does not emit the "using 'master'" advice hint on the runner.
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

jobs:
  validate:
    name: validate (yamllint + ansible-lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install lint tooling
        run: python -m pip install --upgrade ansible-lint yamllint

      - name: Install collections (role deps + community.general for the vm scenario)
        # requirements.yml is the role's runtime dep (ansible.posix only).
        # community.general is needed so ansible-lint can resolve the vm
        # scenario's prepare.yml (community.general.modprobe).  Two commands:
        # ansible-galaxy rejects mixing -r with positional collection names.
        run: |
          ansible-galaxy collection install -r requirements.yml
          ansible-galaxy collection install community.general

      - name: yamllint
        run: yamllint .

      - name: ansible-lint
        run: ansible-lint

  ansible-versions:
    name: syntax-check (ansible-core ${{ matrix.ansible }}, py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # ansible-core x control-node Python. Each series supports a RANGE of
        # Pythons, so pinning one interpreter tests a single point in a 2-D space and
        # the interesting breakage lives at the EDGES: the oldest Python (where a
        # dependency drops support first) and the newest (where an older ansible-core
        # meets an interpreter released after it).
        #
        # So each series is tested at its FLOOR and its CEILING, taken from the
        # release's own classifiers on PyPI:
        #     2.16 / 2.17 -> 3.10, 3.11, 3.12
        #     2.18 / 2.19 -> 3.11, 3.12, 3.13
        #     2.20 / 2.21 -> 3.12, 3.13, 3.14
        # The middle version is skipped deliberately: it has never been the one to
        # break alone, and 12 legs is already the honest cost of this coverage.
        #
        # 3.12 is the ONLY interpreter valid for all six series — which is why the
        # previous single `python-version: "3.12"` pin passed while never exercising
        # 3.10, 3.13 or 3.14 at all.
        #
        # There is no 2.22 on PyPI yet (2.21.3 is newest); add it when it ships.
        include:
          - { ansible: "2.16.*", python: "3.10" }
          - { ansible: "2.16.*", python: "3.12" }
          - { ansible: "2.17.*", python: "3.10" }
          - { ansible: "2.17.*", python: "3.12" }
          - { ansible: "2.18.*", python: "3.11" }
          - { ansible: "2.18.*", python: "3.13" }
          - { ansible: "2.19.*", python: "3.11" }
          - { ansible: "2.19.*", python: "3.13" }
          - { ansible: "2.20.*", python: "3.12" }
          - { ansible: "2.20.*", python: "3.14" }
          - { ansible: "2.21.*", python: "3.12" }
          - { ansible: "2.21.*", python: "3.14" }
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "${{ matrix.python }}"

      - name: Install ansible-core ${{ matrix.ansible }} on python ${{ matrix.python }}
        run: |
          python -VV
          python -m pip install "ansible-core==${{ matrix.ansible }}"
          # Prove the pair actually took: pip resolves "2.16.*" to whatever it likes,
          # and an interpreter mismatch here is the exact thing this matrix exists to
          # catch, so assert both rather than trusting the install step's exit code.
          ansible --version

      - name: Install role collections
        run: ansible-galaxy collection install -r requirements.yml

      - name: Syntax-check the role (resolved via the default scenario)
        # The scenario's roles/ symlink resolves `clevis_encryption` to the repo
        # root, so this parses the whole role under each ansible-core version.
        run: |
          ANSIBLE_ROLES_PATH=molecule/default/roles \
            ansible-playbook -i 'localhost,' --syntax-check molecule/default/converge.yml

  network:
    name: Tier-0 crypto (molecule network, Docker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Molecule (Docker driver)
        run: python -m pip install --upgrade molecule 'molecule-plugins[docker]' ansible

      - name: Install collections
        run: ansible-galaxy collection install community.docker ansible.posix

      - name: molecule test -s network
        run: molecule test -s network

  device-free-tests:
    name: Tier-0 device-free guards (crypttab UUID + disk discovery)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install ansible-core (for the assertion/selection fixtures)
        run: python -m pip install --upgrade ansible-core

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: shellcheck the audit script and test harnesses
        run: shellcheck files/crypttab-uuid-audit.sh tests/crypttab-guard/run.sh tests/discovery/run.sh tests/provisioning-gate/run.sh

      - name: Run the crypttab UUID-collision regression tests
        run: tests/crypttab-guard/run.sh

      - name: Run the disk-discovery selection tests
        run: tests/discovery/run.sh

      # The provisioning gate replaced a controller-side file test that made a
      # resumed run silently do nothing. These fixtures prove the replacement
      # FAILS on bad input, including the case that motivated the sentinel: an
      # empty probe result must never read as "every disk is provisioned".
      - name: Run the provisioning-gate regression tests
        run: tests/provisioning-gate/run.sh
